force_keyboard_focus = true
close_when_open = true
click_to_close = true
as_window = false
single_click_activation = true
selection_wrap = true
global_argument_delimiter = "#"
exact_search_prefix = ">"
theme = "jellybean"
disable_mouse = true
debug = true
page_jump_items = 8
hide_quick_activation = true     
hide_action_hints = false         
hide_action_hints_dmenu = false   
hide_return_action = false        
keybind_symbols = false            
resume_last_query = true         
actions_as_menu = true           
autoplay_videos = true           
ext_background_effect_blur = true
blur_corner_radius = 0            

[niri]
launch_on_empty_workspace = false
launch_on_startup = false         
cmd_on_esc = ""                   

[shell]
exclusive_zone = -1
layer = "overlay"
anchor_top = true
anchor_bottom = true
anchor_left = true
anchor_right = true

[columns]
"symbols" = 3

[placeholders]
"default" = { input = "Find", list = "Nothing here..." }

[keybinds]
close = ["Escape", "ctrl BackSpace"]
next = ["Down"]
previous = ["Up"]
left = ["Left"]
right = ["Right"]
down = ["Down"]
up = ["Up"]
toggle_exact = ["ctrl e"]
resume_last_query = ["ctrl z"]
quick_activate = ["F1", "F2", "F3", "F4"]
page_down = ["Page_Down"]
page_up = ["Page_Up"]
show_actions = ["alt h"]

[providers]
default = [
  "desktopapplications",
  "calc",
  "runner",
  "websearch",
]
empty = ["desktopapplications"]
ignore_preview = []
max_results = 32

[providers.argument_delimiter]
# runner = " "

[providers.sets]
[providers.max_results_provider]

[[providers.prefixes]]
prefix = ";"
provider = "providerlist"

[[providers.prefixes]]
prefix = ">"
provider = "runner"

[[providers.prefixes]]
prefix = "/"
provider = "files"

[[providers.prefixes]]
prefix = "."
provider = "symbols"

[[providers.prefixes]]
prefix = "!"
provider = "todo"

[[providers.prefixes]]
prefix = "%"
provider = "bookmarks"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"

[[providers.prefixes]]
prefix = "$"
provider = "windows"

[providers.clipboard]
time_format = "relative"

[providers.actions]
fallback = [
  { action = "menus:open", label = "open", after = "Nothing" },
  { action = "menus:default", label = "run", after = "Close" },
  { action = "menus:parent", label = "back", bind = "Escape", after = "Nothing" },
  { action = "erase_history", label = "clear hist", bind = "ctrl h", after = "AsyncReload" },
]

dmenu = [{ action = "select", default = true, bind = "Return" }]

providerlist = [
  { action = "activate", default = true, bind = "Return", after = "ClearReload" },
]

bluetooth = [
  { action = "find", bind = "ctrl f", after = "AsyncClearReload" },
  { action = "remove", bind = "ctrl d", after = "AsyncReload" },
  { action = "trust", bind = "ctrl t", after = "AsyncReload" },
  { action = "untrust", bind = "ctrl t", after = "AsyncReload" },
  { action = "pair", bind = "Return", after = "AsyncReload" },
  { action = "connect", default = true, bind = "Return", after = "AsyncReload" },
  { action = "disconnect", default = true, bind = "Return", after = "AsyncReload" },
  { action = "power_on", label = "Power On", bind = "ctrl e", after = "AsyncReload" },
  { action = "power_off", label = "Power Off", bind = "ctrl e", after = "AsyncReload" },
]

archlinuxpkgs = [
  { action = "install", bind = "Return", default = true },
  { action = "remove", bind = "Return", default = true },
  { action = "show_all", label = "show all", bind = "ctrl i", after = "AsyncClearReload" },
  { action = "refresh", label = "refresh", bind = "ctrl r", after = "AsyncReload" },
  { action = "visit_url", label = "open URL", bind = "ctrl o" },
  { action = "show_installed", label = "show installed", bind = "ctrl i", after = "AsyncClearReload" },
]

calc = [
  { action = "copy", default = true, bind = "Return" },
  { action = "delete", bind = "ctrl d", after = "AsyncReload" },
  { action = "delete_all", bind = "ctrl shift d", after = "AsyncReload" },
  { action = "save", bind = "ctrl s", after = "AsyncClearReload" },
]

